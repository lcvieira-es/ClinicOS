<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8F4FD"/>
      <stop offset="100%" stop-color="#dceefb"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#093D69"/>
      <stop offset="100%" stop-color="#05263f"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0FFCBE"/>
      <stop offset="100%" stop-color="#0adfa8"/>
    </linearGradient>
    <radialGradient id="windowLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0FFCBE" stop-opacity="0.1"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background wall -->
  <rect width="1920" height="1080" fill="url(#wallGrad)"/>

  <!-- Floor -->
  <rect y="720" width="1920" height="360" fill="url(#floorGrad)"/>
  <line x1="0" y1="720" x2="1920" y2="720" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Window (left) -->
  <rect x="80" y="120" width="420" height="320" rx="12" fill="url(#windowLight)" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="290" y1="120" x2="290" y2="440" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="80" y1="280" x2="500" y2="280" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Sunlight rays -->
  <g opacity="0.15">
    <polygon points="290,280 80,720 500,720" fill="#0FFCBE"/>
  </g>

  <!-- Plant (left corner) -->
  <g transform="translate(120, 600)">
    <rect x="-8" y="0" width="16" height="120" fill="#0b4a7e"/>
    <ellipse cx="0" cy="-20" rx="45" ry="55" fill="#0adfa8"/>
    <ellipse cx="-30" cy="10" rx="30" ry="40" fill="#08b98b"/>
    <ellipse cx="30" cy="5" rx="32" ry="42" fill="#0adfa8"/>
    <ellipse cx="0" cy="-40" rx="25" ry="30" fill="#6affd8"/>
    <rect x="-18" y="110" width="36" height="24" rx="4" fill="#093d69"/>
  </g>

  <!-- Reception desk -->
  <g filter="url(#softShadow)">
    <rect x="600" y="560" width="720" height="160" rx="16" fill="url(#deskGrad)"/>
    <rect x="600" y="560" width="720" height="24" rx="16" fill="#0b4a7e"/>
    <!-- mint accent stripe -->
    <rect x="600" y="700" width="720" height="8" rx="4" fill="url(#mintGrad)"/>
  </g>
  <!-- Receptionist behind desk -->
  <g transform="translate(820, 500)">
    <circle cx="0" cy="0" r="32" fill="#fcd9b6"/>
    <path d="M-32,32 Q-32,80 0,90 Q32,80 32,32 Z" fill="#093d69"/>
    <rect x="-4" y="-8" width="8" height="16" rx="2" fill="#0b4a7e"/>
    <circle cx="-12" cy="-4" r="3" fill="#0f172a"/>
    <circle cx="12" cy="-4" r="3" fill="#0f172a"/>
    <path d="M-8,8 Q0,14 8,8" stroke="#0f172a" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Computer on desk -->
  <g transform="translate(950, 540)">
    <rect x="-40" y="-30" width="80" height="50" rx="4" fill="#1e293b"/>
    <rect x="-36" y="-26" width="72" height="42" rx="2" fill="#0ea5e9" opacity="0.6"/>
    <rect x="-12" y="20" width="24" height="6" rx="2" fill="#334155"/>
  </g>

  <!-- Waiting area chairs (4 chairs, 2 mint, 2 navy) -->
  <!-- Chair 1 - mint -->
  <g transform="translate(1400, 760)" filter="url(#softShadow)">
    <rect x="-30" y="0" width="60" height="70" rx="8" fill="url(#mintGrad)"/>
    <rect x="-30" y="70" width="60" height="12" rx="4" fill="#08b98b"/>
    <rect x="-24" y="82" width="8" height="40" rx="2" fill="#334155"/>
    <rect x="16" y="82" width="8" height="40" rx="2" fill="#334155"/>
  </g>
  <!-- Chair 2 - navy -->
  <g transform="translate(1500, 760)" filter="url(#softShadow)">
    <rect x="-30" y="0" width="60" height="70" rx="8" fill="#093d69"/>
    <rect x="-30" y="70" width="60" height="12" rx="4" fill="#05263f"/>
    <rect x="-24" y="82" width="8" height="40" rx="2" fill="#334155"/>
    <rect x="16" y="82" width="8" height="40" rx="2" fill="#334155"/>
  </g>
  <!-- Chair 3 - mint -->
  <g transform="translate(1600, 760)" filter="url(#softShadow)">
    <rect x="-30" y="0" width="60" height="70" rx="8" fill="url(#mintGrad)"/>
    <rect x="-30" y="70" width="60" height="12" rx="4" fill="#08b98b"/>
    <rect x="-24" y="82" width="8" height="40" rx="2" fill="#334155"/>
    <rect x="16" y="82" width="8" height="40" rx="2" fill="#334155"/>
  </g>
  <!-- Chair 4 - navy -->
  <g transform="translate(1700, 760)" filter="url(#softShadow)">
    <rect x="-30" y="0" width="60" height="70" rx="8" fill="#093d69"/>
    <rect x="-30" y="70" width="60" height="12" rx="4" fill="#05263f"/>
    <rect x="-24" y="82" width="8" height="40" rx="2" fill="#334155"/>
    <rect x="16" y="82" width="8" height="40" rx="2" fill="#334155"/>
  </g>

  <!-- Patients waiting in chairs -->
  <!-- Patient 1 (in chair 1) -->
  <g transform="translate(1400, 700)">
    <circle cx="0" cy="0" r="22" fill="#fcd9b6"/>
    <path d="M-22,22 Q-22,55 0,62 Q22,55 22,22 Z" fill="#7c3aed"/>
    <circle cx="-7" cy="-2" r="2.5" fill="#0f172a"/>
    <circle cx="7" cy="-2" r="2.5" fill="#0f172a"/>
    <path d="M-5,6 Q0,10 5,6" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Patient 2 (in chair 2) -->
  <g transform="translate(1500, 700)">
    <circle cx="0" cy="0" r="22" fill="#f8d5b5"/>
    <path d="M-22,22 Q-22,55 0,62 Q22,55 22,22 Z" fill="#0ea5e9"/>
    <circle cx="-7" cy="-2" r="2.5" fill="#0f172a"/>
    <circle cx="7" cy="-2" r="2.5" fill="#0f172a"/>
    <path d="M-5,6 Q0,10 5,6" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Patient 3 (in chair 3) -->
  <g transform="translate(1600, 700)">
    <circle cx="0" cy="0" r="22" fill="#fce4d6"/>
    <path d="M-22,22 Q-22,55 0,62 Q22,55 22,22 Z" fill="#ec4899"/>
    <circle cx="-7" cy="-2" r="2.5" fill="#0f172a"/>
    <circle cx="7" cy="-2" r="2.5" fill="#0f172a"/>
    <path d="M-5,6 Q0,10 5,6" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Consultation room (right side, doctor + patient) -->
  <g transform="translate(1350, 300)">
    <!-- Room wall divider -->
    <rect x="0" y="0" width="8" height="420" fill="#cbd5e1"/>
    <!-- Doctor -->
    <g transform="translate(120, 200)">
      <circle cx="0" cy="0" r="26" fill="#fcd9b6"/>
      <path d="M-26,26 Q-26,70 0,80 Q26,70 26,26 Z" fill="#ffffff"/>
      <rect x="-4" y="-6" width="8" height="14" rx="2" fill="#093d69"/>
      <circle cx="-9" cy="-3" r="2.5" fill="#0f172a"/>
      <circle cx="9" cy="-3" r="2.5" fill="#0f172a"/>
      <path d="M-6,5 Q0,9 6,5" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      <!-- Stethoscope -->
      <path d="M-18,40 Q-22,60 -10,70" stroke="#093d69" stroke-width="2" fill="none"/>
      <circle cx="-10" cy="70" r="4" fill="#093d69"/>
    </g>
    <!-- Patient in consultation -->
    <g transform="translate(280, 220)">
      <circle cx="0" cy="0" r="24" fill="#f8d5b5"/>
      <path d="M-24,24 Q-24,62 0,70 Q24,62 24,24 Z" fill="#16a34a"/>
      <circle cx="-8" cy="-2" r="2.5" fill="#0f172a"/>
      <circle cx="8" cy="-2" r="2.5" fill="#0f172a"/>
      <path d="M-6,6 Q0,10 6,6" stroke="#0f172a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Desk between doctor and patient -->
    <rect x="160" y="260" width="120" height="60" rx="6" fill="#e2e8f0"/>
    <rect x="160" y="260" width="120" height="8" rx="4" fill="#093d69"/>
  </g>

  <!-- ClinicOS cross symbol (logo) watermark -->
  <g transform="translate(1800, 100)" opacity="0.12">
    <rect x="-30" y="-8" width="60" height="16" rx="4" fill="#093d69"/>
    <rect x="-8" y="-30" width="16" height="60" rx="4" fill="#093d69"/>
  </g>

  <!-- Top banner strip -->
  <rect x="0" y="0" width="1920" height="6" fill="url(#mintGrad)"/>
</svg>
